; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data
test_dir = firmware/test
build_cache_dir = .cache


[env:seeed_xiao_rp2040]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-rp2040
framework = arduino

board_build.core = earlephilhower
board_build.arduino.earlephilhower.usb_vid = 0x256F
board_build.arduino.earlephilhower.usb_pid = 0xC635
board_build.arduino.earlephilhower.usb_manufacturer = 3Dconnexion
board_build.arduino.earlephilhower.usb_product = CAD Mouse MK2

monitor_echo = yes          ; Lets you see what you are typing
monitor_eol = LF            ; Appends the '\n' when you press Enter
monitor_filters = send_on_enter ; Waits for Enter before sending the string

build_unflags = -Os

build_flags =
	-DUSE_TINYUSB
	-O2
	-fassociative-math ; These two are risky, they can effect stability.
	-freciprocal-math  ; Hopefully we have a lot of exces precision in our 32 bit floats
	-fno-math-errno 
    -fno-trapping-math 
    -fno-rounding-math 
    -fno-signed-zeros
	-D EIGEN_NO_MALLOC ; We don't want to accidentally have non-fixed-size matrices.
	-DNDEBUG           ; Drop debug checks for eigen
	-Wl,-Map=${BUILD_DIR}/firmware.map ; for inspecting the linkers work

lib_deps = 
	infineon/XENSIV 3D Magnetic Sensor TLx493D@^1.1.0
	bxparks/AceButton@^1.10.1
	adafruit/Adafruit NeoPixel@^1.12.3
	hideakitai/ArduinoEigen@^0.3.2

[env:seeed_xiao_rp2040_test]
extends = env:seeed_xiao_rp2040

test_framework = unity
test_build_src = yes
build_unflags = -DNDEBUG

[env:native]
platform = native
test_framework = unity
test_build_src = yes
; Only the portable pose-model code can build without the Arduino
; framework/hardware - exclude controllers, states and main.cpp.
build_src_filter = -<*> +<magnet_model/>
; hideakitai/ArduinoEigen declares "frameworks: arduino" in its library.json,
; so the LDF would otherwise skip it for this frameworkless env. We only use
; its vendored plain-Eigen headers (see math3D.h), not any Arduino-specific
; code path, so it's safe to force through.
lib_compat_mode = off

lib_deps =
	hideakitai/ArduinoEigen@^0.3.2

build_flags =
	-D EIGEN_NO_MALLOC
