; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data
test_dir = firmware/test
build_cache_dir = .cache


[env:seeed_xiao_rp2040]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-rp2040
framework = arduino

board_build.core = earlephilhower
; Carves a LittleFS partition out of flash. Without this the filesystem is
; 0.00MB and nothing can mount. /calibration.bin is 312 bytes, so this is
; almost entirely headroom -- LittleFS wants room for its metadata blocks and
; wear levelling, and the rest of flash stays available for program space.
board_build.filesystem_size = 64k
; Presenting as a 3Dconnexion device is what gets the vendor's CAD drivers to
; bind to it. Demo of that working: https://youtu.be/62xlzGs8LXA?t=383
board_build.arduino.earlephilhower.usb_vid = 0x256F
board_build.arduino.earlephilhower.usb_pid = 0xC635
board_build.arduino.earlephilhower.usb_manufacturer = 3Dconnexion
board_build.arduino.earlephilhower.usb_product = CAD Mouse MK2

monitor_echo = yes          ; Lets you see what you are typing
monitor_eol = LF            ; Appends the '\n' when you press Enter
monitor_filters = send_on_enter ; Waits for Enter before sending the string

build_unflags = -Os

; magnet_model_unity.cpp #includes the five hot-path .cpp files, so it must not
; be compiled alongside them. The default build uses the individual files; see
; [env:seeed_xiao_rp2040_unity] below for the other arrangement.
build_src_filter =
	+<*>
	-<magnet_model/magnet_model_unity.cpp>

build_flags =
	-DUSE_TINYUSB
	-O3
	-fassociative-math ; These two are risky, they can effect stability.
	-freciprocal-math  ; Hopefully we have a lot of exces precision in our 32 bit floats
	-fno-math-errno
    -fno-trapping-math
    -fno-rounding-math
    -fno-signed-zeros
	; Licenses folds like x*0.0f -> 0.0f, which is what lets the general
	; skew_matrix()-based Jacobian assembly (virtual_sensor.cpp) match the
	; hand-unrolled version's cost -- see TODO/Performance.md. Risk: this also
	; licenses folding isnan()/isinf()/isfinite()-style checks into a
	; constant, since the compiler assumes "not finite" is unreachable.
	; math3D.h's is_finite_bits() (used by all_finite() and
	; CalibrationStorage.cpp's isPlausible()) reads the raw bit pattern
	; instead, which isn't a floating-point operation this flag governs, so
	; it stays reliable. Does not recover a NaN that got folded away
	; upstream, before reaching a check -- see TODO/Performance.md for that
	; residual risk.
	-ffinite-math-only
	-DNDEBUG           ; Standard release-mode assert() stripping.
	-Wl,-Map=${BUILD_DIR}/firmware.map ; for inspecting the linkers work

; BasicLinearAlgebra lives in firmware/lib/BasicLinearAlgebra, not lib_deps:
; TODO/eigen-to-bla-migration.md vendors and patches it (drops the
; Printable base that was giving every BLA::Matrix a hidden vtable pointer
; -- +18.5KB of RAM on the bicubic table alone), so it can't be pulled from
; the registry unmodified.
lib_deps =
	infineon/XENSIV 3D Magnetic Sensor TLx493D@^1.1.0
	bxparks/AceButton@^1.10.1
	adafruit/Adafruit NeoPixel@^1.12.3

[env:seeed_xiao_rp2040_test]
extends = env:seeed_xiao_rp2040

test_framework = unity
test_build_src = yes
build_unflags = -DNDEBUG

; Opt-in variant that compiles the solver hot path as a single translation unit.
; Deliberately a separate environment rather than a change to the default build.
;
; `pio run -e seeed_xiao_rp2040_unity` confirms build_src_filter does what it
; should here -- it compiles exactly one object, magnet_model_unity.cpp.o, in
; place of the five separate ones -- so the platformio-core#3616 LDF concern
; that motivated keeping this separate does not bite in practice. Measured
; payoff (host dynamic instruction count, see TODO/Performance.md): -1.3% at
; -O2, ~0% at -O3. Small enough that it's kept opt-in rather than promoted to
; the default build; delete this env and the unity .cpp if that ~1% isn't
; worth carrying a second environment for.
[env:seeed_xiao_rp2040_unity]
extends = env:seeed_xiao_rp2040

build_src_filter =
	+<*>
	-<magnet_model/BicubicField.cpp>
	-<magnet_model/magnet_local_model.cpp>
	-<magnet_model/virtual_sensor.cpp>
	-<magnet_model/forward_model.cpp>
	-<magnet_model/solve_pose.cpp>

; Host build of the magnet_model unit tests, for running them without a board.
;
; The solver's analytic Jacobians are pure math over BLA -- the five
; magnet_model translation units include only <cmath> and
; BasicLinearAlgebra.h, no board registers -- so test_jacobian.cpp can be
; exercised off-target. TODO/Performance.md did exactly this ad hoc (384/384
; grid points) while verifying the solver rewrites were numerically
; equivalent; this makes that arrangement reproducible instead of rebuilt
; from scratch each time. Formalizes what an earlier BLA-migration pass did
; entirely out-of-repo, in a session scratchpad -- see
; TODO/eigen-to-bla-migration.md.
;
; NOT a replacement for env:seeed_xiao_rp2040_test. That one runs on the real
; FPU-less M0+ against soft-float, which is the target's actual arithmetic;
; this runs x86 hardware floats. A Jacobian that passes here is strong evidence
; and not a substitute -- run the hardware test before believing a derivative
; is correct on target.
[env:native_test]
platform = native
test_framework = unity
test_build_src = yes

; Everything outside magnet_model/ is controllers, states and drivers that need
; the Arduino framework, so the host build takes only the solver chain.
build_src_filter =
	-<*>
	+<magnet_model/BicubicField.cpp>
	+<magnet_model/magnet_local_model.cpp>
	+<magnet_model/virtual_sensor.cpp>
	+<magnet_model/forward_model.cpp>
	+<magnet_model/magnet_model_table.cpp>

build_flags =
	-std=c++17
	; Stands in for the Arduino framework header. See
	; firmware/host_shims/Arduino.h for exactly what it supplies and why
	; (__not_in_flash_func, plus a minimal Print for BLA::MatrixBase::printTo()
	; to typecheck against).
	-I $PROJECT_DIR/firmware/host_shims
	; BasicLinearAlgebra is vendored under firmware/lib (see this file's
	; [env:seeed_xiao_rp2040] comment) and [platformio]'s lib_dir picks it up
	; there for the real board environment's LDF -- but LDF does not run the
	; same way against the frameworkless "native" platform (confirmed: without
	; this, the build fails to find BasicLinearAlgebra.h at all), so this
	; environment needs its own explicit include path to the same vendored
	; copy. Same source either way, which is the point -- a host build against
	; a different copy would not be testing the same code.
	-I $PROJECT_DIR/firmware/lib/BasicLinearAlgebra
	; NDEBUG deliberately not set, matching env:seeed_xiao_rp2040_test -- though
	; BLA has no runtime assertions to unlock either way (see
	; firmware/test/README), so this mainly keeps plain assert() live.
