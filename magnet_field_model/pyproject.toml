[project]
name = "magnet-field-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Reads the firmware's CalibrationParams declaration and computes its
    # layout, so the /calibration.bin field order is not restated in Python.
    # ABI mode only - no compiler needed. See calibration/firmware_struct.py.
    "cffi>=1.17",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "magpylib>=5.2.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pyserial>=3.5",
    "rich>=15.0.0",
    "scipy>=1.18.0",
    "sympy>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
    "mypy>=1.15",
    "types-pyserial>=3.5.0.20260712",
    "scipy-stubs>=1.18.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_incomplete_defs = true
